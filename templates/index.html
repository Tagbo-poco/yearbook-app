<!DOCTYPE html>
<html>
<head>
    <title>UCIS-Yearbook Search</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            overflow-y: auto;
            background: #f4f6f9;
        }

        .container {
            display: flex;
            min-height: 100vh;
            flex-direction: row-reverse;
        }

        /* 右边背景 */
        .left {
            flex: 1;
            background: url("{{ url_for('static', filename='images/bg.jpg') }}");
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            background-color: #0b3c66;
            position: sticky;
            top: 0;
            height: 100vh;
        }

        /* 左边搜索区域 */
        .right {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 50px 20px;
            background: rgba(255,255,255,0.2);
            backdrop-filter: blur(15px);
        }

        .card {
            width: 350px;
            padding: 30px;
            border-radius: 20px;
            background: rgba(255,255,255,0.25);
            backdrop-filter: blur(20px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        h2 {
            text-align: center;
            margin-bottom: 10px;
            color: #111;
        }

        .subtitle {
            text-align: center;
            color: gray;
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 10px;
            border: none;
            outline: none;
            background: rgba(255,255,255,0.8);
            box-sizing: border-box;
            font-size: 14px;
        }

        input:focus {
            box-shadow: 0 0 10px #4facfe;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            background: linear-gradient(to right, #4facfe, #00f2fe);
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 15px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            transform: scale(1.03);
            opacity: 0.95;
        }

        .result {
            margin-top: 25px;
            background: white;
            padding: 18px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            text-align: center;
            animation: fadeIn 0.4s ease;
        }

        .result h3 {
            margin-bottom: 10px;
        }

        .result p {
            margin: 5px 0;
            color: #555;
        }

        .student-image {
            margin-top: 12px;
            width: 130px;
            border-radius: 12px;
            box-shadow: 0 5px 12px rgba(0,0,0,0.2);
        }

        .no-result {
            margin-top: 20px;
            text-align: center;
            color: gray;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* 手机适配 */
        @media (max-width: 900px) {
            .container {
                flex-direction: column;
            }

            .left {
                height: 250px;
                position: relative;
            }

            .right {
                padding: 30px 15px;
            }

            .card {
                width: 100%;
                max-width: 350px;
            }
        }

    </style>
</head>

<body>

<div class="container">

    <!-- 右边学校背景 -->
    <div class="left"></div>

    <!-- 左边搜索 -->
    <div class="right">

        <div class="card">

            <h2>UCIS-Yearbook Search</h2>
            <p class="subtitle">Find student information</p>

            <form method="post">
                <input name="name" placeholder="Search name...">
                <input name="grade" placeholder="Search grade...">
                <input name="class" placeholder="Search class...">

                <button type="submit">Search</button>
            </form>

            <!-- 搜索结果 -->
            {% if results %}

                {% for r in results %}
                <div class="result">

                    <h3>{{ r.name }}</h3>

                    <p>Grade: {{ r.grade }}</p>
                    <p>Class: {{ r.class }}</p>
                    <p>Date: {{ r.date }}</p>

                    {% if r.image %}
                        <img
                            class="student-image"
                            src="{{ url_for('static', filename='images/' + r.image) }}"
                        >
                    {% else %}
                        <p>No Image</p>
                    {% endif %}

                </div>
                {% endfor %}

            {% else %}
                <p class="no-result">No result found</p>
            {% endif %}

        </div>

    </div>

</div>

</body>
</html>
